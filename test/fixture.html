<!doctype html><html><head><title>Тест</title></head><body>
<h1>Вход</h1>
<form onsubmit="event.preventDefault(); document.getElementById('out').textContent='Привет, '+document.querySelector('[name=login]').value+' ('+document.querySelector('select').value+')';">
  <label for="l">Логин</label><input id="l" name="login" placeholder="Ваш логин">
  <select name="city"><option value="msk">Москва</option><option value="spb">Питер</option></select>
  <label><input type="checkbox" id="agree"> Согласен</label>
  <button type="submit">Войти</button>
</form>
<div id="out"></div>
<a href="#more" onclick="document.getElementById('more').hidden=false">Подробнее</a>
<p id="more" hidden>Скрытый текст</p>
</body></html>
